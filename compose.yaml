volumes:
  postgres_data: {}
  static_volume: {}
  media_volume: {}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      USER_ID: ${USER_ID:-1000}

  env_file:
    - .env

  # Inside the compose network the services are reachable by name on their
  # container ports, overriding whatever host/port .env uses for local runs.
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379

services:
  app-wsgi:
    <<: *app
    command: /start-wsgi.sh
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - static_volume:/wd/staticfiles
      - media_volume:/wd/media
    profiles:
      - full_dev

  app-asgi:
    <<: *app
    command: /start-asgi.sh
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/wd/staticfiles
      - media_volume:/wd/media
    profiles:
      - full_dev

  nginx:
    image: nginx:alpine
    # No host ports here on purpose: compose concatenates "ports" across files, so
    # publishing here would leave the override binding 80, 443 *and* its own port.
    # Each override picks the host port it wants (dev uses 8080).
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - app-wsgi
      - app-asgi
    profiles:
      - full_dev

  init:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /init.sh
    profiles:
      - full_dev
      - local_dev

  postgres:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=${POSTGRES_USER} --dbname=${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    profiles:
      - full_dev
      - local_dev

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full_dev
      - local_dev
