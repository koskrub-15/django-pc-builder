volumes:
  postgres_data: {}
  static_volume: {}
  media_volume: {}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env

  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432

services:
  app-wsgi:
    <<: *app
    command: /start-wsgi.sh
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - static_volume:/wd/staticfiles
      - media_volume:/wd/media
    profiles:
      - full_dev

  app-asgi:
    <<: *app
    command: /start-asgi.sh
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/wd/staticfiles
      - media_volume:/wd/media
    profiles:
      - full_dev


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - app-wsgi
      - app-asgi
    profiles:
      - full_dev

  init:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /init.sh
    profiles:
      - full_dev
      - local_dev

  postgres:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=${POSTGRES_USER} --dbname=${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    profiles:
      - full_dev
      - local_dev

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full_dev
      - local_dev
