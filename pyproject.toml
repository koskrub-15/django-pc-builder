[project]
name = "django-pc-builder"
version = "0.1.0"
description = "Django PC Builder & E-Commerce Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "channels>=4.2.2",
    "channels-redis>=4.2.1",
    "crispy-bootstrap5>=2025.4",
    "daphne>=4.2.0",
    # Pinned to the 5.2 LTS series: Channels and crispy-bootstrap5 do not yet
    # advertise support for Django 6.1, and 5.2 is supported until April 2028.
    "django>=5.2.13,<6",
    "django-allauth>=65.8.1",
    "django-cleanup>=9.0.0",
    "django-environ>=0.12.0",
    "gunicorn>=23.0.0",
    "pillow>=11.2.1",
    "psycopg[binary]>=3.3.4",
]

[tool.ruff]
line-length = 120

extend-exclude = [
]

[tool.ruff.lint]
extend-select = [
    "ALL",
]
extend-ignore = [
    # Docstrings are required (D1 is on), with three carve-outs that carry no
    # information in a Django codebase:
    # Missing docstring in magic method — __str__/__repr__ say what they say.
    "D105",
    # Missing docstring in nested class — this is almost always Django's Meta.
    "D106",
    # Missing docstring in __init__ — the class docstring covers it.
    "D107",
    # flake8-future-annotations.
    "FA",
    # Missing type annotation for self and cls.
    "ANN1",
    # f-strings to format logging messages.
    "G004",
    # Consider {expression} instead of string join.
    "FLY002",
    # TODOs
    # Author.
    "TD002",
    # Link to issue
    "TD003",
    # Line contains a TODO or related comment
    "FIX",
    # Args and kwargs are not used and not annotated
    "ANN002",
    "ANN003",
    #
    "ERA001", # Commented code
    #
    "PLR2044", # Empty comment
    #
    #    "T201", # print statement. Don't remove in this app, because it's a Proof of Concept.
    #
    "DJ012", # django-unordered-body-content-in-model
    #
    "CPY001", # Missing copyright notice. This is a portfolio project, not licensed code.
    #
    # Trailing commas: ruff-format owns them, and the rule fights the formatter.
    "COM812",
]

task-tags = [
    "TODO",
    "FIXME",
    "HACK",
    "XXX",
    "[",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
# https://betterprogramming.pub/3-different-docstring-formats-for-python-d27be81e0d68

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true


[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
    # Unused import.
    "F401",
    # Missing docstring in public package: these are empty package markers.
    "D104",
]

"*/migrations/*.py" = [
    # Mutable class default.
    "RUF012",
    # Line too long.
    "E501",
    # Missing docstrings: these files are generated by makemigrations.
    "D1",
]

"*/tests/*.py" = [
    # Missing docstrings: a test's name is its description, and requiring a
    # docstring on every case buys repetition rather than explanation.
    # Test classes and non-obvious cases still get one where it helps.
    "D1",
    # flake8-pytest-style: assumes pytest bare `assert`, project uses Django TestCase (unittest style).
    "PT",
    # Hardcoded password in function arg: false positive on test fixture credentials.
    "S106",
]

"manage.py" = [
    # Django's standard manage.py boilerplate imports inside the try/except on purpose.
    "PLC0415",
]


[tool.djlint]
ignore="H006"

[tool.coverage.run]
source = ["apps"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.3",
]
