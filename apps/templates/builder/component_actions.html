{% extends "_helpers/_base.html" %}
{% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm builder-form">
                    <div class="card-body p-4">
                        {% if component %}
                            <h4 class="card-title mb-4">Update Component</h4>
                        {% else %}
                            <h4 class="card-title mb-4">Add New Component</h4>
                        {% endif %}
                        <form method="post" class="component-form">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label }}</label>
                                {{ form.name }}
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="{{ form.price.id_for_label }}" class="form-label">{{ form.price.label }}</label>
                                    <div class="input-group">
                                        {{ form.price }}
                                        <span class="input-group-text">€</span>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="{{ form.link.id_for_label }}" class="form-label">{{ form.link.label }}</label>
                                    {{ form.link }}
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <a href="{% url 'builder:builds' %}" class="btn btn-outline-secondary">← Back to Builds</a>
                                {% if component %}
                                    <button type="submit" class="btn btn-primary">Update Component</button>
                                {% else %}
                                    <button type="submit" class="btn btn-primary">Add Component</button>
                                {% endif %}
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
