name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      # core.test_settings runs on in-memory SQLite with a locmem email backend,
      # so no Postgres/Redis service containers and no secrets are needed here.
      - name: Run tests with coverage
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run coverage run manage.py test apps --settings=core.test_settings
          uv run coverage xml
          uv run coverage report --fail-under=90

      # Catches production-hardening regressions (secure cookies, HSTS, SSL
      # redirect) that never show up when DEBUG is on.
      - name: Django deployment checks
        env:
          DJANGO__SECRET_KEY: ci-only-secret-key-not-used-anywhere-real-0123456789
          DJANGO__DEBUG: "False"
          DJANGO__ALLOWED_HOSTS: example.com
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          EMAIL_HOST: smtp.example.com
          EMAIL_PORT: "587"
          EMAIL_USE_TLS: "True"
          EMAIL_HOST_USER: ci@example.com
          EMAIL_HOST_PASSWORD: ci
        run: uv run python manage.py check --deploy --fail-level WARNING

      # fail_ci_if_error is off by default, which lets a rejected upload (an
      # expired or missing CODECOV_TOKEN) pass as a green step and silently stop
      # reporting. Only enforced on push: forks cannot read the secret at all,
      # and dependabot PRs read it from the Dependabot store, not this one.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # The justfile formatting hook shells out to the "just" binary, which the
      # runner does not ship.
      - name: Install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # pre-commit-update rewrites .pre-commit-config.yaml whenever a hook has a
      # newer release, which would fail CI on unrelated PRs — dependabot owns
      # those bumps instead. no-commit-to-branch is a local-only guard.
      - name: Run pre-commit hooks
        env:
          SKIP: no-commit-to-branch,pre-commit-update
        uses: pre-commit/action@v3.0.1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # --no-hashes: pip-audit resolves in its own venv on the runner's default
      # Python, so it picks wheels for a different tag than the lock was
      # resolved for and every hash mismatches. Versions are what it audits.
      - name: Audit dependencies
        run: uv export --frozen --no-emit-project --no-hashes | uvx pip-audit -r /dev/stdin

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare configs
        run: |
          cp .env.example .env
          cp compose.override.dev.yaml compose.override.yaml

      # Not "--wait": the one-shot "init" service exits as soon as migrations are
      # applied, which that flag treats as a failure. Poll the app instead.
      - name: Build and start the stack
        env:
          COMPOSE_PROFILES: full_dev
          USER_ID: "1000"
        run: docker compose up --build --detach

      - name: Wait for the app to answer
        run: |
          for _ in $(seq 60); do
            if curl --fail --silent --output /dev/null http://localhost:8080/; then
              echo "app is up"
              exit 0
            fi
            sleep 5
          done
          echo "app did not come up within 300s" >&2
          exit 1

      # Guards the wiring that is easy to break silently: nginx must serve
      # collectstatic output itself, and proxy /ws/ through to daphne.
      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          curl --fail --silent --show-error http://localhost:8080/blog/ > /dev/null
          curl --fail --silent --show-error \
            http://localhost:8080/static/app/styles/index.css | head -c 1 > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8080/ws/chat/1/)" = "404"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 0
